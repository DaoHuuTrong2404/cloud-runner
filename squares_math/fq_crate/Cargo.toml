[package]
name = "packer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packer"
path = "src/main.rs"

[dependencies]
clarabel = "=0.11.1"
amd = "=0.2.2"

[features]
# perf 11-14 (item 2b): 32-lane L-BFGS dot products in fq (rounding-only change, needs a decision before default)
dot32 = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[[bin]]
name = "fq"
path = "src/fq.rs"

[[bin]]
name = "anneal"
path = "src/anneal.rs"

[[bin]]
name = "harden"
path = "src/harden.rs"

[[bin]]
name = "santa_ga"
path = "src/santa_ga.rs"
