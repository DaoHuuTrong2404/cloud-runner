        run: |
          tar -xf megapool_w28.tar
          mkdir -p "artifacts/w28b_${SHARD_ID}" /tmp/sq_w28_ds /tmp/sq_bins
          (cd squares_math/fq_crate && cargo build --release --bin fq)
          ln -sf "$(pwd)/squares_math/fq_crate/target/release/fq" /tmp/sq_bins/fq
          ln -sf "$(pwd)/squares_math/seeds/pub_base_v5.npz" /tmp/sq_w28_ds/pub_base_v5.npz
          ln -sf "$(pwd)/squares_math/seeds/frontier_targets_public.json" /tmp/sq_w28_ds/frontier_targets_public.json
          ln -sf "$(pwd)/squares_math/tools/"*.py /tmp/sq_w28_ds/
          export SQ_DS_DIR="/tmp/sq_w28_ds"
          export FQ_BIN="/tmp/sq_bins/fq"
