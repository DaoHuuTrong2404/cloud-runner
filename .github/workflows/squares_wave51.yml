      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m pip install --upgrade pip
          pip install numpy scipy numba highspy pandas
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.run_tag }}-megapool-bundle
          path: .
      - name: Run Wave 51F 48-Core Sub-0.0085 GPeel/TP -> 3-Round Deep-Polish eta<=0.28 Wider-Hopper!
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: |
          tar -xf megapool_w51.tar
          mkdir -p "artifacts/w51f_${SHARD_ID}" /tmp/sq_w51_ds /tmp/sq_bins
          (cd squares_math/fq_crate && cargo build --release --bin fq)
          ln -sf "$(pwd)/squares_math/fq_crate/target/release/fq" /tmp/sq_bins/fq
          ln -sf "$(pwd)/squares_math/seeds/pub_base_v5.npz" /tmp/sq_w51_ds/pub_base_v5.npz
          ln -sf "$(pwd)/squares_math/tools/"*.py /tmp/sq_w51_ds/
          export SQ_DS_DIR="/tmp/sq_w51_ds"
          export FQ_BIN="/tmp/sq_bins/fq"
          python3 -u squares_math/workers/w51f_gpeel_deep_polish_widehopper.py \
            --union-npz /tmp/sq_w51_ds/pub_base_v5.npz \
            --win-glob "pool/wins/**/*.npz" \
            --shard "$SHARD_ID" --num-shards 12 --procs 4 --budget-sec 2300 \
            --r1-sec 175 --r2-sec 160 --r3-sec 175 --max-gap 0.0085 --seed-off 520000 \
            --out-npz "artifacts/w51f_${SHARD_ID}/w51f_gp3r_s${SHARD_ID}.npz"
          ls -lh "artifacts/w51f_${SHARD_ID}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.run_tag }}-w51f-${{ matrix.shard }}
          path: artifacts/w51f_${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7

  wave51l_staircase_and_lns_widehopper:
    needs: consolidate_w51_megapool
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["0","1","2","3","4","5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m pip install --upgrade pip
          pip install numpy scipy numba highspy pandas
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.run_tag }}-megapool-bundle
          path: .
      - name: Run Wave 51L 24-Core Staircase Splices + Macro Band-LNS -> 3-Round Deep-Polish Wider-Hopper!
        env:
          SHARD_ID: ${{ matrix.shard }}
        run: |
          tar -xf megapool_w51.tar
          mkdir -p "artifacts/w51l_${SHARD_ID}" /tmp/sq_w51_ds /tmp/sq_bins
          (cd squares_math/fq_crate && cargo build --release --bin fq)
          ln -sf "$(pwd)/squares_math/fq_crate/target/release/fq" /tmp/sq_bins/fq
          ln -sf "$(pwd)/squares_math/seeds/pub_base_v5.npz" /tmp/sq_w51_ds/pub_base_v5.npz
          ln -sf "$(pwd)/squares_math/seeds/frontier_targets_public.json" /tmp/sq_w51_ds/frontier_targets_public.json
          ln -sf "$(pwd)/squares_math/tools/"*.py /tmp/sq_w51_ds/
          export SQ_DS_DIR="/tmp/sq_w51_ds"
          export FQ_BIN="/tmp/sq_bins/fq"
          python3 -u squares_math/workers/w51l_staircase_and_lns_widehopper.py \
            --union-npz /tmp/sq_w51_ds/pub_base_v5.npz \
            --win-glob "pool/wins/**/*.npz" \
            --frontier-json /tmp/sq_w51_ds/frontier_targets_public.json \
            --shard "$SHARD_ID" --num-shards 6 --procs 4 --budget-sec 2300 \
            --r1-sec 175 --r2-sec 155 --seed-off 525000 \
            --out-npz "artifacts/w51l_${SHARD_ID}/w51l_stairlns_s${SHARD_ID}.npz"
          ls -lh "artifacts/w51l_${SHARD_ID}"
      - uses: actions/upload-artifact@v4
